[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-reveal-component"
version = "0.0.1"
description = "Cinematic 3D voice-reveal gallery component for Streamlit"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "VoxSense", email = "dev@example.com" }]
dependencies = ["streamlit >= 1.51"]

[tool.setuptools.packages.find]
include = ["voice_reveal_component*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
voice_reveal_component = ["frontend/build/**/*", "pyproject.toml"]
